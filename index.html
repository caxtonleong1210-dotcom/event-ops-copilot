<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event Ops Copilot | 活動籌備助手</title>
<style>
:root{--navy:#14213d;--gold:#c9a227;--bg:#f5f6fa;--line:#dde1ea;--red:#c0392b;--amber:#d68910;--green:#1e8449}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:#222;line-height:1.5}
header{background:var(--navy);color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
header h1{margin:0;font-size:20px}header h1 span{color:var(--gold)}
header small{opacity:.8;display:block;font-size:12px}
.langbtn{background:var(--gold);border:0;color:var(--navy);font-weight:700;padding:7px 14px;border-radius:6px;cursor:pointer}
main{max-width:1150px;margin:auto;padding:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:18px}
h2{margin:0 0 12px;font-size:17px;color:var(--navy);border-left:4px solid var(--gold);padding-left:8px}
.demos{display:flex;gap:10px;flex-wrap:wrap}
.demos button{flex:1;min-width:200px;padding:12px;border:1px solid var(--navy);background:#fff;border-radius:8px;cursor:pointer;text-align:left}
.demos button:hover{background:#eef1f8}.demos b{display:block;color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
label{font-size:13px;font-weight:600;display:block;margin-bottom:3px}
input,select{width:100%;padding:8px;border:1px solid #c7ccd8;border-radius:6px;font-size:14px}
.chk{display:flex;gap:14px;flex-wrap:wrap;font-size:14px}.chk label{font-weight:400;display:flex;gap:5px;align-items:center}.chk input{width:auto}
.btn{background:var(--navy);color:#fff;border:0;padding:10px 20px;border-radius:6px;font-size:15px;cursor:pointer;margin-top:14px}
.btn.alt{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.banner{background:#fff8e1;border:1px solid #f0d27a;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:18px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:#eef1f8}
td[contenteditable]{background:#fffef5}td[contenteditable]:focus{outline:2px solid var(--gold)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:#eef1f8;border-radius:8px;padding:10px;text-align:center}.kpi b{font-size:22px;color:var(--navy);display:block}
.gantt{font-size:12px}.grow{display:grid;grid-template-columns:260px 1fr;align-items:center;border-bottom:1px dashed var(--line);min-height:26px}
.track{position:relative;height:18px;background:#f3f4f8}
.bar{position:absolute;height:18px;border-radius:4px;background:var(--navy)}
.bar.c1{background:#2e86c1}.bar.c2{background:var(--gold)}.bar.c3{background:var(--green)}.bar.c4{background:var(--red)}
.axis{display:flex;justify-content:space-between;font-size:11px;color:#666;margin-left:260px}
.lv{font-weight:700;padding:2px 6px;border-radius:4px;color:#fff;font-size:11px}
.H{background:var(--red)}.M{background:var(--amber)}.L{background:var(--green)}
.approve{background:#eaf6ee;border:1px solid #a9dbb8;padding:12px;border-radius:8px}
.hidden{display:none}
footer{text-align:center;font-size:12px;color:#777;padding:20px}
.draft{color:var(--red);font-weight:700}
@media print{header button,.noprint{display:none!important}body{background:#fff}.card{break-inside:avoid;border:0;padding:6px 0}main{padding:0}td[contenteditable]{background:#fff}}
.ai{border:2px dashed #8e44ad}.aitag{display:inline-block;background:#8e44ad;color:#fff;font-size:12px;padding:2px 8px;border-radius:4px}
.ann{white-space:pre-wrap;border:1px solid var(--line);background:#fffbe6;padding:10px;border-radius:6px;min-height:60px}
.airisk{background:#f5eefa}.mini{padding:4px 10px;font-size:12px;margin:0}
.tabs button{border:1px solid var(--navy);background:#fff;padding:6px 12px;border-radius:6px;cursor:pointer;margin-right:6px}.tabs button.on{background:var(--navy);color:#fff}
</style>
</head>
<body>
<header>
 <div><h1>Event Ops <span>Copilot</span></h1><small data-i="sub"></small></div>
 <button class="langbtn" onclick="toggleLang()" data-i="langbtn"></button>
</header>
<main>
<div class="banner noprint" data-i="banner"></div>

<div class="card noprint"><h2 data-i="demoT"></h2>
 <div class="demos">
  <button onclick="loadDemo(0)"><b data-i="d0"></b><span data-i="d0s"></span></button>
  <button onclick="loadDemo(1)"><b data-i="d1"></b><span data-i="d1s"></span></button>
  <button onclick="loadDemo(2)"><b data-i="d2"></b><span data-i="d2s"></span></button>
 </div>
</div>

<div class="card noprint"><h2 data-i="briefT"></h2>
 <div class="grid">
  <div><label data-i="fName"></label><input id="name"></div>
  <div><label data-i="fType"></label><select id="type"></select></div>
  <div><label data-i="fVenue"></label><select id="venue" onchange="venueDefaults()"></select></div>
  <div><label data-i="fCap"></label><input id="cap" type="number" min="1"></div>
  <div><label data-i="fPax"></label><input id="pax" type="number" min="1"></div>
  <div><label data-i="fDate"></label><input id="date" type="date"></div>
  <div><label data-i="fStart"></label><input id="start" type="time"></div>
  <div><label data-i="fDur"></label><input id="dur" type="number" min="1" max="12" step="0.5"></div>
  <div><label data-i="fGates"></label><input id="gates" type="number" min="1"></div>
  <div><label data-i="fBudget"></label><select id="budget"></select></div>
  <div><label data-i="fOutdoor"></label><select id="outdoor"></select></div>
  <div><label data-i="fMinor"></label><select id="minor"></select></div>
 </div>
 <div style="margin-top:12px"><label data-i="fMix"></label>
  <div class="grid">
   <div><label data-i="mCN"></label><input id="mCN" type="number" min="0" max="100"></div>
   <div><label data-i="mHK"></label><input id="mHK" type="number" min="0" max="100"></div>
   <div><label data-i="mLocal"></label><input id="mLocal" type="number" min="0" max="100"></div>
   <div><label data-i="mIntl"></label><input id="mIntl" type="number" min="0" max="100"></div>
  </div></div>
 <details style="margin-top:12px"><summary data-i="ratioT" style="cursor:pointer;font-weight:600"></summary>
  <div class="grid" style="margin-top:8px">
   <div><label data-i="rSec"></label><input id="rSec" type="number" min="1"></div>
   <div><label data-i="rUsher"></label><input id="rUsher" type="number" min="1"></div>
   <div><label data-i="rMed"></label><input id="rMed" type="number" min="1"></div>
   <div><label data-i="rTicket"></label><input id="rTicket" type="number" min="1"></div>
  </div><p style="font-size:12px;color:#666" data-i="ratioNote"></p></details>
 <button class="btn" onclick="generate()" data-i="gen"></button>
 <div id="err" style="color:var(--red);margin-top:8px"></div>
</div>

<div id="out" class="hidden">
 <div class="card"><h2 data-i="sumT"></h2><p class="draft" data-i="draftTag"></p><div id="summary"></div></div>
 <div class="card"><h2 data-i="ganttT"></h2><div id="gantt" class="gantt"></div></div>
 <div class="card"><h2 data-i="cdT"></h2><p style="font-size:12px" data-i="editNote"></p><div id="countdown"></div></div>
 <div class="card"><h2 data-i="rosT"></h2><div id="ros"></div></div>
 <div class="card"><h2 data-i="staffT"></h2><div id="staff"></div></div>
 <div class="card"><h2 data-i="riskT"></h2><div id="risk"></div></div>
 <div class="card ai"><h2 data-i="aiT"></h2><p><span class="aitag" data-i="aiTag"></span> <span style="font-size:12px" data-i="aiNote"></span></p>
  <button class="btn noprint" id="bAI" onclick="runAI()" data-i="aiBtn"></button> <span id="aiStatus" style="font-size:13px"></span>
  <div id="aiOut" class="hidden">
   <div class="tabs noprint" id="annTabs"></div>
   <div id="annBox" class="ann" contenteditable></div>
   <h3 style="font-size:15px;margin-top:16px" data-i="aiRiskT"></h3><div id="aiRisks"></div>
  </div>
 </div>
 <div class="card noprint"><h2 data-i="appT"></h2>
  <div class="approve">
   <div class="grid"><div><label data-i="appBy"></label><input id="appBy"></div><div><label data-i="appRole"></label><input id="appRole"></div></div>
   <div class="chk" style="margin-top:10px"><label><input type="checkbox" id="appChk" onchange="checkApp()"> <span data-i="appChk"></span></label></div>
  </div>
  <button class="btn" id="bPdf" disabled onclick="exportPdf()" data-i="pdf"></button>
  <button class="btn alt" id="bXls" disabled onclick="exportExcel()" data-i="xls"></button>
 </div>
 <div class="card hidden" id="appPrint"></div>
</div>
</main>
<footer data-i="foot"></footer>

<script>
let LANG='en';
const T={
sub:["Integrated-Resort Event Planning Assistant · Rules-based, human-approved","綜合度假村活動籌備助手 · 規則計算 · 人手審批"],
langbtn:["中文","English"],
banner:["Demo resort: <b>Harbour Grand Resort</b> (fictional). Phase 2: all numbers and schedules are generated by transparent planning rules — no AI guesswork. Every output is a DRAFT for human review. Regulatory items are reminders only; verify against the latest official requirements.","示範度假村：<b>Harbour Grand Resort</b>（虛構）。第 2 階段：所有數字和時間表都由透明規則計算，不依賴 AI 猜測。全部輸出均為草稿，須人手審核。法規相關項目只作提醒，請按最新官方要求核實。"],
demoT:["1 · Load a demo case","1 · 載入示範案例"],
d0:["🎤 5,000-pax Concert","🎤 5,000 人演唱會"],d0s:["Arena · evening · mixed audience","綜藝館 · 晚間 · 觀眾多元"],
d1:["💼 800-pax Corporate Conference","💼 800 人企業會議"],d1s:["Convention hall · full day · MICE","會展廳 · 全日 · 商務會展"],
d2:["🏮 Lunar New Year Carnival","🏮 新春戶外嘉年華"],d2s:["Outdoor plaza · families · typhoon-free season","戶外廣場 · 家庭客 · 冬季"],
briefT:["2 · Event brief","2 · 活動簡介"],
fName:["Event name","活動名稱"],fType:["Event type","活動類型"],fVenue:["Venue type","場地類型"],fCap:["Venue capacity","場地容量"],
fPax:["Expected attendance","預計人數"],fDate:["Event date","活動日期"],fStart:["Doors / start time","開門／開始時間"],fDur:["Programme length (hours)","節目時長（小時）"],
fGates:["Entry gates","入口數目"],fBudget:["Budget tier","預算級別"],fOutdoor:["Outdoor component","戶外部分"],fMinor:["Under-21 guests possible","可能有未滿 21 歲賓客"],
fMix:["Guest mix (%)","客群比例（%）"],mCN:["Mainland China","內地"],mHK:["Hong Kong","香港"],mLocal:["Macau local","澳門本地"],mIntl:["International","國際"],
ratioT:["⚙ Staffing ratios (editable to match your company standard)","⚙ 人手比例（可按公司標準修改）"],
rSec:["Guests per security officer","每名保安對應賓客數"],rUsher:["Guests per usher","每名接待對應賓客數"],rMed:["Guests per first-aider","每名急救員對應賓客數"],rTicket:["Guests per ticketing/registration staff","每名票務／登記人員對應賓客數"],
ratioNote:["Defaults are planning assumptions for demonstration, not regulatory figures.","預設值是示範用的規劃假設，並非法定數字。"],
gen:["Generate execution pack ▶","生成活動執行包 ▶"],
sumT:["Execution pack summary","執行包摘要"],draftTag:["DRAFT — pending human approval","草稿 — 待人手審批"],
ganttT:["Planning timeline (Gantt)","籌備時間軸（甘特圖）"],cdT:["Countdown task list (T-60 → T+7)","倒數工作清單（T-60 → T+7）"],
editNote:["Yellow cells are editable — click to adjust before approval.","黃色格可直接修改，審批前可按需要調整。"],
rosT:["Event-day run of show","活動當日流程表"],staffT:["Staffing plan","人手配置"],riskT:["Risk register (Macau-specific)","風險清單（澳門特色）"],
appT:["3 · Approval & export","3 · 審批及匯出"],appBy:["Approved by","審批人"],appRole:["Role","職位"],
appChk:["I have reviewed this draft and approve it for export.","本人已審閱此草稿並批准匯出。"],
pdf:["Export PDF","匯出 PDF"],xls:["Export Excel","匯出 Excel"],
foot:["Event Ops Copilot · Portfolio project · Fictional demo data only · No personal data collected","Event Ops Copilot · 作品集項目 · 只使用虛構示範資料 · 不收集任何個人資料"],
errFill:["Please complete all fields (attendance, capacity, date, time, duration, gates).","請填妥所有欄位（人數、容量、日期、時間、時長、入口）。"],
errCap:["⚠ Expected attendance exceeds venue capacity — reduce attendance or change venue.","⚠ 預計人數超過場地容量，請減少人數或更換場地。"],
errMix:["Guest mix must add up to 100%.","客群比例總和必須為 100%。"],
yes:["Yes","是"],no:["No","否"],
cols:{phase:["Phase","階段"],day:["Day","日子"],date:["Date","日期"],task:["Task","工作"],owner:["Owner","負責部門"],status:["Status","狀態"],
time:["Time","時間"],item:["Item","項目"],role:["Role","崗位"],count:["Headcount","人數"],basis:["Basis","計算依據"],
risk:["Risk","風險"],lvl:["Level","等級"],mit:["Mitigation / contingency","預防及應變"],
},
todo:["To do","待辦"],
aiT:["4 · AI drafts: multilingual announcement & extra risks","4 · AI 草稿：多語言公告及補充風險"],
aiTag:["AI DRAFT · human proofreading required","AI 草稿 · 需人工校對"],
aiNote:["AI only writes text. All numbers above come from the rule engine. AI risks are added only when you click Adopt.","AI 只負責文字，上面所有數字都由規則計算。AI 建議的風險要按「採納」才會加入清單。"],
aiBtn:["✨ Generate AI drafts","✨ 生成 AI 草稿"],aiRiskT:["AI-suggested additional risks","AI 建議的補充風險"],
adopt:["Adopt","採納"],adopted:["✓ Adopted","✓ 已採納"],
aiWait:["Generating… (usually 5–15 s)","生成中…（通常 5–15 秒）"],aiOk:["✓ AI draft generated — please proofread.","✓ 已生成 AI 草稿，請校對。"],
aiFb:["ℹ AI service unavailable — showing built-in template draft (demo mode).","ℹ AI 服務暫時無法使用，現顯示內置範本草稿（示範模式）。"]
};
const t=k=>Array.isArray(T[k])?T[k][LANG=='en'?0:1]:k;
const c=k=>T.cols[k][LANG=='en'?0:1];
const L=(e,z)=>LANG=='en'?e:z;

const TYPES={concert:["Concert / Show","演唱會／表演"],conference:["Corporate conference (MICE)","企業會議（會展）"],festival:["Festive carnival","節慶嘉年華"],sports:["Sports event","體育賽事"],gala:["Gala dinner / F&B promotion","晚宴／餐飲推廣"]};
const VENUES={arena:[["Arena","大型綜藝館"],5000,8],ballroom:[["Ballroom","宴會廳"],1200,3],hall:[["Convention hall","會展廳"],2000,4],plaza:[["Outdoor plaza","戶外廣場"],4000,5],lounge:[["Restaurant / lounge","餐廳／酒廊"],250,1]};
const BUDGETS={std:["Standard","標準"],prem:["Premium","高級"],flag:["Flagship","旗艦"]};
const DEMOS=[
 {name:"Harbour Grand Live 2025 – Pop Concert",type:"concert",venue:"arena",cap:5500,pax:5000,date:"2025-08-16",start:"19:00",dur:3,gates:8,budget:"prem",outdoor:"no",minor:"yes",mCN:55,mHK:25,mLocal:15,mIntl:5},
 {name:"Asia Fintech Leaders Summit",type:"conference",venue:"hall",cap:1200,pax:800,date:"2025-11-06",start:"08:30",dur:8,gates:3,budget:"prem",outdoor:"no",minor:"no",mCN:40,mHK:20,mLocal:10,mIntl:30},
 {name:"Lunar New Year Family Carnival",type:"festival",venue:"plaza",cap:4000,pax:3000,date:"2026-02-17",start:"14:00",dur:6,gates:5,budget:"std",outdoor:"yes",minor:"yes",mCN:50,mHK:15,mLocal:30,mIntl:5}];
const RATIO_DEF={rSec:100,rUsher:150,rMed:500,rTicket:250};
const $=id=>document.getElementById(id);
let LAST=null;

function fillSelects(){
 const keep={type:$('type').value,venue:$('venue').value,budget:$('budget').value,outdoor:$('outdoor').value,minor:$('minor').value};
 $('type').innerHTML=Object.entries(TYPES).map(([k,v])=>`<option value="${k}">${L(...v)}</option>`).join('');
 $('venue').innerHTML=Object.entries(VENUES).map(([k,v])=>`<option value="${k}">${L(...v[0])}</option>`).join('');
 $('budget').innerHTML=Object.entries(BUDGETS).map(([k,v])=>`<option value="${k}">${L(...v)}</option>`).join('');
 ['outdoor','minor'].forEach(s=>$(s).innerHTML=`<option value="no">${t('no')}</option><option value="yes">${t('yes')}</option>`);
 for(const k in keep) if(keep[k]) $(k).value=keep[k];
}
var applyLang=function(){
 document.documentElement.lang=LANG=='en'?'en':'zh-Hant';
 document.querySelectorAll('[data-i]').forEach(e=>e.innerHTML=t(e.dataset.i));
 fillSelects(); if(LAST) render();
}
function toggleLang(){LANG=LANG=='en'?'zh':'en';applyLang();}
function venueDefaults(){const v=VENUES[$('venue').value];$('cap').value=v[1];$('gates').value=v[2];}
function loadDemo(i){const d=DEMOS[i];for(const k in d)$(k).value=d[k];for(const k in RATIO_DEF)$(k).value=RATIO_DEF[k];generate();}

function read(){
 const f={};['name','type','venue','date','start','budget','outdoor','minor'].forEach(k=>f[k]=$(k).value);
 ['cap','pax','dur','gates','mCN','mHK','mLocal','mIntl','rSec','rUsher','rMed','rTicket'].forEach(k=>f[k]=parseFloat($(k).value));
 return f;
}
function addDays(ds,n){const d=new Date(ds+'T00:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function addMin(hm,m){let [h,mi]=hm.split(':').map(Number);let x=h*60+mi+m;x=((x%1440)+1440)%1440;return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0');}

/* ---------- RULE ENGINE ---------- */
function countdown(f){
 const big=f.pax>=2000, R=[];
 const add=(d,e,z,o,ph)=>R.push({d,en:e,zh:z,o,ph});
 add(-60,"Confirm event concept, budget and KPIs","確定活動概念、預算及關鍵指標","Event Planning",0);
 add(-60,"Hold venue & back-of-house areas; check clash with other resort events","預留場地及後勤區域；檢查與其他度假村活動是否撞期","Venue Mgmt",0);
 add(-55,"Submit licence / permit applications to relevant government authorities (verify current lead times)","向相關政府部門遞交准照／許可申請（請核實最新所需時間）","Event Planning / Legal",0);
 if(f.type=='concert'||f.type=='festival'||f.type=='sports') add(-50,"Contract artists / performers; confirm rider & visa/work-permit needs","簽約藝人／表演者；確認技術要求及簽證／工作許可","Entertainment",0);
 if(f.type=='conference') add(-50,"Confirm speakers, agenda and registration platform","確認講者、議程及登記平台","Event Planning",0);
 add(-45,"Brief Hotel Ops on room-block & check-in/out peaks","向酒店營運部簡報房間預留及入住／退房高峰","Hotel Ops",0);
 add(-40,"Appoint suppliers: AV, staging, security contractor, F&B","委任供應商：影音、舞台、保安承辦商、餐飲","Procurement",0);
 add(-35,"Draft crowd-flow plan and site map"+(f.minor=='yes'?" (routes must avoid gaming floor)":""),"草擬人流動線及場地圖"+(f.minor=='yes'?"（路線須避開博彩區）":""),"Security",1);
 add(-30,"Launch marketing & ticketing / registration (EN/繁/简)","展開宣傳及售票／登記（英／繁／簡）","Marketing",1);
 add(-30,"Book cross-border shuttle coaches (Border Gate, HZMB, ferry terminals)","預訂跨境接駁巴士（關閘、港珠澳大橋、碼頭）","Transport",1);
 add(-25,"Fire safety & venue layout review","消防安全及場地佈局檢查","Engineering / Safety",1);
 if(f.outdoor=='yes') add(-21,"Confirm wet-weather / typhoon backup venue and decision timeline","確認雨天／颱風後備場地及決策時間表","Event Planning",1);
 add(-21,"Finalise staffing plan; book multilingual staff","落實人手配置；預約多語言人員","HR / Event Ops",1);
 add(-14,"Prepare refund & postponement policy (typhoon / black rainstorm)","制定退款及延期政策（颱風／黑雨）","Event Planning / Finance",1);
 add(-14,"Media & VIP guest list lock","鎖定傳媒及貴賓名單","PR",1);
 add(-10,"Coordinate with police / traffic on drop-off and dispersal","與警方／交通部門協調上落客及散場安排","Security / Transport",2);
 add(-7,"Final run-of-show; issue staff briefing pack","最終流程表；發出員工簡報資料","Event Ops",2);

 $('annTabs').innerHTML=ANNL.map(([k,lab])=>`<button class="${k==ANNTAB?'on':''}" onclick="showAnn('${k}')">${lab}</button>`).join('');
 $('annBox').innerText=AI.announcements[ANNTAB];
 $('aiRisks').innerHTML=`<table><tr><th>${c('lvl')}</th><th>${c('risk')}</th><th>${c('mit')}</th><th class="noprint"></th></tr>${AI.risks.map((r,i)=>`<tr class="airisk"><td><span class="lv ${r.level}">${r.level=='H'?L('HIGH','高'):r.level=='M'?L('MED','中'):L('LOW','低')}</span></td><td>${esc(L(r.risk_en,r.risk_zh))}</td><td>${esc(L(r.mitigation_en,r.mitigation_zh))}</td><td class="noprint"><button class="btn mini" ${r.done?'disabled':''} onclick="adopt(${i})">${r.done?t('adopted'):t('adopt')}</button></td></tr>`).join('')}</table>`;
}
function adopt(i){const r=AI.risks[i];r.done=true;saveAnn();
 LAST.rk.push({lv:r.level,en:'[AI] '+r.risk_en,zh:'[AI] '+r.risk_zh,me:r.mitigation_en,mz:r.mitigation_zh,o:r.owner||'Event Ops'});
 const o={H:0,M:1,L:2};LAST.rk.sort((a,b)=>o[a.lv]-o[b.lv]);render();}
document.addEventListener('input',e=>{if(e.target.id=='annBox')saveAnn();});
const _applyLang=applyLang; applyLang=function(){_applyLang();renderAI();};
for(const k in RATIO_DEF)$(k).value=RATIO_DEF[k];
applyLang();
</script>
</body>
</html>
